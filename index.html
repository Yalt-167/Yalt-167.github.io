<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">Portfolio: Riviale Antoine</title>

    <link rel="stylesheet" href="Style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div id="langSwitch" class="site-lang"></div>

        <section class="hero">
            <div class="hero-content">
                <h1>Riviale Antoine</h1>
                <h2 data-i18n="hero.role"></h2>
                <p data-i18n-html="hero.intro"></p>

                <h3 data-i18n="hero.wip"></h3>
            </div>
        </section>

        <section class="projects-section">
            <h2 class="section-title" data-i18n="projects.title"></h2>

            <div id="projectFilters" class="project-filters"></div>
            <div id="projectsGrid" class="projects-grid"></div>
        </section>

        <section class="contact-section">
            <h2 data-i18n="contact.title"></h2>
            <div class="contact-links">
                <a href="https://github.com/Yalt-167" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/antoine-riviale-a04a35293/" target="_blank" >LinkedIn</a>
                <a href="javascript:CopyEmail();" data-i18n="contact.copyEmail"></a>
            </div>
        </section>
    </main>
    <script src="I18n.js"></script>
    <script src="Data.js"></script>
    <script src="BuildProjectCardsGrid.js"></script>
    <script>
    function CopyEmail()
    {
        navigator.clipboard.writeText("antoine.riviale@gmail.com")
            .then(() => alert(T("contact.copied")))
            .catch((error) => alert(`${T("contact.copyFailed")}: ${error}`))
        ;
    }

    ApplyStaticTranslations();
    document.getElementById("langSwitch").innerHTML = MakeLanguageSwitch();
    </script>
</body>
</html>
