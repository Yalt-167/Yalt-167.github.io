<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">Portfolio: Riviale Antoine</title>

    <link rel="stylesheet" href="Style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div id="langSwitch" class="site-lang"></div>

        <section class="hero">
            <div class="hero-content">
                <h1>Riviale Antoine</h1>
                <h2 data-i18n="hero.role"></h2>
                <p data-i18n-html="hero.intro"></p>

                <h3 data-i18n="hero.wip"></h3>
            </div>
        </section>

        <section class="projects-section">
            <h2 class="section-title" data-i18n="projects.title"></h2>

            <div id="projectFilters" class="project-filters"></div>
            <div id="projectsGrid" class="projects-grid"></div>
        </section>

        <section class="contact-section">
            <h2 data-i18n="contact.title"></h2>
            <div class="contact-links">
                <a href="https://github.com/Yalt-167" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/antoine-riviale-a04a35293/" target="_blank" >LinkedIn</a>
                <a href="mailto:antoine.riviale@gmail.com" data-i18n="contact.email"></a>
                <button id="copyEmailButton" type="button" aria-live="polite" data-i18n="contact.copyEmail"></button>
            </div>
        </section>
    </main>
    <script src="I18n.js"></script>
    <script src="Data.js"></script>
    <script src="BuildProjectCardsGrid.js"></script>
    <script>
    const EMAIL = "antoine.riviale@gmail.com";

    async function CopyEmail(event)
    {
        const button = event.currentTarget;

        try
        {
            // navigator.clipboard only exists on https:// and localhost
            await navigator.clipboard.writeText(EMAIL);
        }
        catch
        {
            // can't copy: show the address instead so it can still be selected
            button.textContent = EMAIL;
            button.classList.add("show-email");
            return;
        }

        button.textContent = T("contact.copied");
        clearTimeout(button.resetTimer);
        button.resetTimer = setTimeout(() => button.textContent = T("contact.copyEmail"), 2000);
    }

    ApplyStaticTranslations();
    document.getElementById("copyEmailButton").addEventListener("click", CopyEmail);
    document.getElementById("langSwitch").innerHTML = MakeLanguageSwitch();
    </script>
</body>
</html>
