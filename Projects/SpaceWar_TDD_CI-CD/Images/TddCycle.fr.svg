<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="TDD : rouge, vert, refactor">
<title>TDD : rouge, vert, refactor</title>
<defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00f5a0"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8f98a8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4cc26a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef5b5b"/></marker></defs>
<rect width="1600" height="900" fill="#0a0c11"/>
<text x="48" y="70" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e8eaf0" text-anchor="start">TDD : rouge, vert, refactor</text>
<rect x="48" y="124" width="480" height="444" rx="14" fill="#10131a" stroke="#ef5b5b" stroke-width="1.5"/>
<text x="76" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ef5b5b" text-anchor="start" letter-spacing="2">1 · ROUGE</text>
<text x="76" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e8eaf0" text-anchor="start">Écrire un test qui échoue</text>
<rect x="72" y="224" width="432" height="232" rx="8" fill="#0c0f15" stroke="#262c38" stroke-width="1.2"/>
<text x="92" y="260" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#8f98a8" xml:space="preserve">[Test]</text>
<text x="92" y="290" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">void TakeDamage_Normal_ReducesHealth()</text>
<text x="92" y="320" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">{</text>
<text x="92" y="350" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">    player.TakeDamage(20);</text>
<text x="92" y="380" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">    Assert.AreEqual(80, player.Health);</text>
<text x="92" y="410" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">}</text>
<rect x="72" y="482" width="432" height="54" rx="27" fill="none" stroke="#ef5b5b" stroke-width="1.2"/>
<text x="288.0" y="516" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ef5b5b" text-anchor="middle">✗  échoue : pas encore de TakeDamage()</text>
<path d="M530.0 340.0 L558.0 340.0" fill="none" stroke="#00f5a0" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<rect x="560" y="124" width="480" height="444" rx="14" fill="#10131a" stroke="#4cc26a" stroke-width="1.5"/>
<text x="588" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#4cc26a" text-anchor="start" letter-spacing="2">2 · VERT</text>
<text x="588" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e8eaf0" text-anchor="start">Écrire juste assez de code</text>
<rect x="584" y="224" width="432" height="232" rx="8" fill="#0c0f15" stroke="#262c38" stroke-width="1.2"/>
<text x="604" y="260" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">public void TakeDamage(int amount)</text>
<text x="604" y="290" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">{</text>
<text x="604" y="320" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">    Health = Mathf.Max(0,</text>
<text x="604" y="350" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">        Health - amount);</text>
<text x="604" y="380" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#e8eaf0" xml:space="preserve">}</text>
<rect x="584" y="482" width="432" height="54" rx="27" fill="none" stroke="#4cc26a" stroke-width="1.2"/>
<text x="800.0" y="516" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4cc26a" text-anchor="middle">✓  passe</text>
<path d="M1042.0 340.0 L1070.0 340.0" fill="none" stroke="#00f5a0" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<rect x="1072" y="124" width="480" height="444" rx="14" fill="#10131a" stroke="#00f5a0" stroke-width="1.5"/>
<text x="1100" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#00f5a0" text-anchor="start" letter-spacing="2">3 · REFACTOR</text>
<text x="1100" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#e8eaf0" text-anchor="start">Nettoyer, les tests restent verts</text>
<rect x="1096" y="224" width="432" height="232" rx="8" fill="#0c0f15" stroke="#262c38" stroke-width="1.2"/>
<text x="1116" y="260" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#8f98a8" xml:space="preserve">// plus de nombres magiques</text>
<text x="1116" y="290" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#ef5b5b" xml:space="preserve">- Assert.AreEqual(80, player.Health);</text>
<text x="1116" y="320" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#4cc26a" xml:space="preserve">+ Assert.AreEqual(</text>
<text x="1116" y="350" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#4cc26a" xml:space="preserve">+     player.BaseHealth - damage,</text>
<text x="1116" y="380" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#4cc26a" xml:space="preserve">+     player.Health);</text>
<rect x="1096" y="482" width="432" height="54" rx="27" fill="none" stroke="#4cc26a" stroke-width="1.2"/>
<text x="1312.0" y="516" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4cc26a" text-anchor="middle">✓  passe toujours</text>
<path d="M1304.0 570.0 L1304.0 606.0 L288.0 606.0 L288.0 572.0" fill="none" stroke="#00f5a0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-accent)" stroke-dasharray="6 5"/>
<text x="796" y="640" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#00f5a0" text-anchor="middle">comportement suivant (ex. dégâts négatifs) → un nouveau test qui échoue</text>
<rect x="48" y="664" width="1504" height="184" rx="14" fill="#10131a" stroke="#262c38" stroke-width="1.2"/>
<text x="76" y="700" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#00f5a0" text-anchor="start" letter-spacing="2">POINTS CLÉS</text>
<circle cx="80" cy="740" r="3.5" fill="#00f5a0"/>
<text x="96" y="746" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">Les tests passent en premier et décrivent le comportement attendu</text>
<circle cx="832" cy="740" r="3.5" fill="#00f5a0"/>
<text x="848" y="746" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">N'écrire que le code dont le test actuel a besoin</text>
<circle cx="80" cy="788" r="3.5" fill="#00f5a0"/>
<text x="96" y="794" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">Refactoriser uniquement quand tous les tests sont verts</text>
<circle cx="832" cy="788" r="3.5" fill="#00f5a0"/>
<text x="848" y="794" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">À chaque push, GitHub Actions relance tous les tests</text>
<rect x="560" y="860" width="480" height="30" rx="8" fill="none" stroke="#262c38" stroke-width="1.2"/>
<text x="800" y="880" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8f98a8" text-anchor="middle" letter-spacing="3">TDD · ROUGE, VERT, REFACTOR</text>
</svg>
