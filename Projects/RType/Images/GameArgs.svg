<rect x="48" y="664" width="1000" height="184" rx="14" fill="#10131a" stroke="#262c38" stroke-width="1.2"/>
<text x="76" y="698" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#00f5a0" text-anchor="start" letter-spacing="2">WHY ONE STRUCT</text>
<circle cx="88" cy="731" r="12" fill="none" stroke="#00f5a0" stroke-width="1.5"/>
<text x="88" y="736" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f5a0" text-anchor="middle">1</text>
<text x="112" y="736" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#e8eaf0" text-anchor="start">Most systems need the renderer, the game state and the current level at once.</text>
<circle cx="88" cy="767" r="12" fill="none" stroke="#00f5a0" stroke-width="1.5"/>
<text x="88" y="772" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f5a0" text-anchor="middle">2</text>
<text x="112" y="772" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#e8eaf0" text-anchor="start">Passing them one by one breaks the 80-column and 30-lines-per-function limits.</text>
<circle cx="88" cy="803" r="12" fill="none" stroke="#00f5a0" stroke-width="1.5"/>
<text x="88" y="808" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f5a0" text-anchor="middle">3</text>
<text x="112" y="808" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#e8eaf0" text-anchor="start">One GameArgs* keeps signatures short, and new shared data needs no signature change.</text>
<rect x="1080" y="664" width="472" height="184" rx="14" fill="#10131a" stroke="#262c38" stroke-width="1.2"/>
<text x="1316" y="698" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#00f5a0" text-anchor="middle" letter-spacing="2">KEY POINTS</text>
<circle cx="1108" cy="727" r="3" fill="#00f5a0"/>
<text x="1122" y="732" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8eaf0" text-anchor="start">An 8-byte pointer instead of a 280-byte copy</text>
<circle cx="1108" cy="755" r="3" fill="#00f5a0"/>
<text x="1122" y="760" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8eaf0" text-anchor="start">Every system edits the same instance</text>
<circle cx="1108" cy="783" r="3" fill="#00f5a0"/>
<text x="1122" y="788" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8eaf0" text-anchor="start">Big structs (SDL, Scene, Boss...) also go by pointer</text>
<circle cx="1108" cy="811" r="3" fill="#00f5a0"/>
<text x="1122" y="816" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8eaf0" text-anchor="start">Trade-off: functions see more than they need</text>
<rect x="560" y="860" width="480" height="30" rx="8" fill="none" stroke="#262c38" stroke-width="1.2"/>
<text x="800" y="880" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8f98a8" text-anchor="middle" letter-spacing="3">R-TYPE · GAMEARGS LAYOUT</text>
</svg>
