<text x="1212" y="192" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#a77bf3" text-anchor="start">Coroutine</text>
<text x="1212" y="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">segments (lambdas) + instructions</text>
<text x="1212" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">de yield (WaitForSeconds...)</text>
<rect x="1190" y="280" width="362" height="104" rx="10" fill="#10131a" stroke="#f2a93b" stroke-width="1.4"/>
<text x="1212" y="314" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#f2a93b" text-anchor="start">MulticastDelegate&lt;Args...&gt;</text>
<text x="1212" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">+= des callbacks, puis tous appelés</text>
<rect x="1190" y="402" width="362" height="104" rx="10" fill="#10131a" stroke="#3d9df5" stroke-width="1.4"/>
<text x="1212" y="436" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#3d9df5" text-anchor="start">ResourceManager::Load&lt;T&gt;()</text>
<text x="1212" y="464" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">chargée une fois, puis mise</text>
<text x="1212" y="486" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">en cache par type et chemin</text>
<rect x="1190" y="524" width="362" height="104" rx="10" fill="#10131a" stroke="#4cc26a" stroke-width="1.4"/>
<text x="1212" y="558" font-family="'Space Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#4cc26a" text-anchor="start">Property&lt;T&gt;</text>
<text x="1212" y="586" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">propriétés façon C# grâce à la</text>
<text x="1212" y="608" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">surcharge d'opérateurs</text>
<rect x="48" y="664" width="1504" height="184" rx="14" fill="#10131a" stroke="#262c38" stroke-width="1.2"/>
<text x="76" y="700" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#00f5a0" text-anchor="start" letter-spacing="2">POINTS CLÉS</text>
<circle cx="80" cy="740" r="3.5" fill="#00f5a0"/>
<text x="96" y="746" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">Chaque module a Init, Update, Render, PostRender et Shutdown, dans l'ordre</text>
<circle cx="832" cy="740" r="3.5" fill="#00f5a0"/>
<text x="848" y="746" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">Les scènes possèdent les GameObjects, qui possèdent leurs composants</text>
<circle cx="80" cy="788" r="3.5" fill="#00f5a0"/>
<text x="96" y="794" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">L'API reprend celle de Unity : GetComponent, Awake, StartCoroutine</text>
<circle cx="832" cy="788" r="3.5" fill="#00f5a0"/>
<text x="848" y="794" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e8eaf0" text-anchor="start">Des templates partout : composants, ressources, délégués, scènes</text>
<rect x="560" y="860" width="480" height="30" rx="8" fill="none" stroke="#262c38" stroke-width="1.2"/>
