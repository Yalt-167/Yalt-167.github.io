<text x="436" y="612" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f98a8" text-anchor="start">AddComponent() met Awake() en file sur la scène : il s'exécute au début de l'update suivant</text>
<text x="1190" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e8eaf0" text-anchor="start" letter-spacing="2">UTILITAIRES</text>
